[project]
name = "afu-shared"
version = "0.1.0"
description = "Shared SQLAlchemy models, enums, settings and DB session factory for the AFU RTM helpdesk platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "aiogram>=3.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["afu_shared*"]
