# The SPA container is also the site's single entry point.
#
# /api, /oauth, /media and /health belong to the backend; everything else is the SPA.
# That split lives HERE rather than in the external reverse proxy (BunkerWeb) on purpose:
# an outer proxy only has to forward rtm.afu.uz to this one container and needs no
# per-path rules. When the split lived only in the outer proxy, a missing rule sent every
# request to the SPA — POST /api/... came back 405 ("wrong password" on the login page)
# and /oauth/login came back index.html, so HEMIS login silently did nothing.

# BunkerWeb sets X-Forwarded-Proto; fall back to our own scheme when nothing did.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Attachments on requests. Keep in step with the backend's own upload limit.
    client_max_body_size 25m;

    # Docker's embedded DNS. Resolving through a variable (below) rather than at config
    # load means nginx starts even while the backend is still booting, and picks up a new
    # container IP after a rebuild instead of caching the old one forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Vite emits content-hashed filenames under /assets, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|oauth|media)/ {
        set $backend_upstream http://backend:8000;
        # $request_uri keeps the original path AND query string — the OAuth callback
        # carries ?code=...&state=... and must arrive intact.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        # The backend's redirects are either absolute (to HEMIS) or root-relative — both
        # are already correct for the browser, so nginx must not rewrite them.
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        access_log off;
    }

    # The SPA uses BrowserRouter with no basename, so unknown paths must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
