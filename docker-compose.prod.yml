# Production stack for https://rtm.afu.uz
#   docker compose -f docker-compose.prod.yml up -d --build
#
# TLS and public traffic are handled by BunkerWeb, which lives outside this file. Only the
# backend (18081) and frontend (18080) are published, and only for BunkerWeb to reach —
# set BIND_ADDRESS=127.0.0.1 when BunkerWeb runs on the same host. Postgres and Redis are
# reachable only on the internal compose network.
#
# BunkerWeb must route /api/*, /oauth/*, /media/* and /health to the backend, and
# everything else to the frontend — see DEPLOY.md §4. Without those rules every request
# lands on the SPA and both web and bot login break.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - afu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - afu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    ports:
      # BunkerWeb routes /api/*, /oauth/*, /media/* and /health here.
      # Restrict this port to the BunkerWeb host in the firewall — anything that can reach
      # it directly bypasses the WAF and TLS entirely.
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_HTTP_PORT:-18081}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build-time, not runtime — see frontend/Dockerfile. Empty = same-origin /api calls.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    logging: *default-logging
    ports:
      # BunkerWeb routes everything else here (the SPA). Same firewall caveat as backend.
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-18080}:80"

volumes:
  afu_postgres_data:
  afu_redis_data:
  afu_uploads:
