# Production stack for https://rtm.afu.uz
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. Postgres, Redis, the backend and the frontend are reachable
# only on the internal compose network — never expose them on a public host.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Internal router, published on a unique host port.
  #
  # Traffic chain: aaPanel -> BunkerWeb (TLS + WAF) -> <host>:CADDY_HTTP_PORT -> caddy
  # -> backend/frontend. TLS is terminated upstream by BunkerWeb, so Caddy speaks plain
  # HTTP and must not attempt ACME (see deploy/Caddyfile).
  #
  # Port 80 is already taken on this host, hence the non-standard default. Set CADDY_BIND
  # to 127.0.0.1 when BunkerWeb runs on the same machine, so the port is not reachable
  # from outside at all; leave it 0.0.0.0 when BunkerWeb connects over an internal network.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-18080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - afu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - afu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build-time, not runtime — see frontend/Dockerfile. Empty = same-origin /api calls.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"

volumes:
  afu_postgres_data:
  afu_redis_data:
  afu_uploads:
  caddy_config:
