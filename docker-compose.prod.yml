# Production stack for https://rtm.afu.uz
#   docker compose -f docker-compose.prod.yml up -d --build
#
# TLS and public traffic are handled by BunkerWeb, which lives outside this file.
#
# Exactly ONE port is published: the frontend on 18080. That container is the site's entry
# point — its nginx serves the SPA and proxies /api, /oauth, /media and /health to the
# backend over the internal network (deploy/frontend-nginx.conf). So the outer proxy needs
# a single upstream and no per-path rules. Set BIND_ADDRESS=127.0.0.1 when BunkerWeb runs
# on the same host. Postgres, Redis, the backend and the worker stay internal.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - afu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - afu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    # No published port: the frontend container reaches this over the compose network as
    # http://backend:8000. Publishing it would only create a way to bypass the WAF and TLS.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - afu_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Build-time, not runtime — see frontend/Dockerfile. Empty = same-origin /api calls.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    logging: *default-logging
    ports:
      # The only published port. Point BunkerWeb's rtm.afu.uz upstream at it and nothing
      # else. Anything that can reach it directly bypasses the WAF and TLS, so keep it off
      # the public interface in the firewall.
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-18080}:80"

volumes:
  afu_postgres_data:
  afu_redis_data:
  afu_uploads:
