[project]
name = "afu-worker"
version = "0.1.0"
description = "arq background worker for the AFU RTM helpdesk platform"
requires-python = ">=3.12"
dependencies = [
    "afu-shared",
    "arq>=0.26",
    "httpx>=0.27.0",
    "aiogram>=3.10.0",
    "redis>=5.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
